:root {

  --bg2: #111a2e;
  --bg3: #1a2642;
  --surface: rgba(17, 26, 46, 0.8);
  --glass: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.12);
  --green: #00ff88;
  --green-dim: rgba(0,255,136,0.15);
  --green-glow: rgba(0,255,136,0.35);
  --orange: #ff7a18;
  --orange-dim: rgba(255,122,24,0.15);
  --text: #e6edf5;
  --text-dim: #8b9bb5;
  --danger: #ff4d6d;
  --danger-dim: rgba(255,77,109,0.15);
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0f1c;
    --text: #e6edf5;
  }
}

* {
  font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
}

.mono {
  font-family: 'JetBrains Mono', monospace;
}

::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-thumb {
  background: var(--glass-border);
  border-radius: 10px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

.glass {
  background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
}

.glass-strong {
  background: linear-gradient(135deg, rgba(17,26,46,0.9), rgba(10,15,28,0.95));
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
}

.btn-green {
  background: var(--green);
  color: #0a0f1c;
  font-weight: 700;
  box-shadow: 0 0 24px var(--green-glow);
  transition: all .2s;
}

.btn-green:hover {
  transform: translateY(-1px);
  box-shadow: 0 0 32px var(--green-glow);
}

.btn-green:active {
  transform: translateY(0);
}

.shimmer {
  position: relative;
  overflow: hidden;
}

.shimmer::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
  transform: translateX(-100%);
  animation: shimmer 1.8s infinite;
}

@keyframes shimmer {
  100% {
    transform: translateX(100%);
  }
}

@keyframes popIn {
  0% {
    transform: scale(.9) translateY(10px);
    opacity:0;
  }

  100% {
    transform: scale(1) translateY(0);
    opacity:1;
  }
}

.toast-enter {
  animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
}
